services:
  postgres:
    image: postgres:16-alpine
    container_name: smartsms-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_sms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartsms-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-smart_sms}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/docker/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/docker/.env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-120000}
      AI_CHAT_PATH: ${AI_CHAT_PATH:-/v1/chat/completions}
      AI_PROVIDER: ${AI_PROVIDER:-remote}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
